name: Build Windows Exe

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    # windows-2022 heeft WiX 3 voorgeïnstalleerd (zelfde runner als upstream Sparrow).
    # windows-latest (2025) heeft geen WiX 3 meer, en WiX 7 via dotnet vereist EULA-acceptatie.
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Set up Java 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Check WiX
      shell: pwsh
      run: |
        $wix = Get-Command candle.exe -ErrorAction SilentlyContinue
        if (-not $wix) {
          $dir = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset*" | Select-Object -First 1
          if ($dir) { "$($dir.FullName)\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH }
          else { Write-Error "WiX 3 niet gevonden op de runner"; exit 1 }
        }

    - name: Build with Gradle (JPackage)
      run: ./gradlew jpackage --stacktrace

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: Sparrow-Windows-Installer
        path: build/jpackage/*.msi
        if-no-files-found: error
